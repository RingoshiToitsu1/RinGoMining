[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbbot"
version = "0.1.0"
description = "Autonomous Kalshi x Polymarket cross-platform arbitrage trading system"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=42",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polymarket-us>=2.4",
]

[project.optional-dependencies]
# Polymarket international CLOB (not available to US persons).
intl = ["py_clob_client_v2>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
arbbot = "arbbot.__main__:main"
arbbot-backtest = "arbbot.backtesting.cli:main"

[tool.setuptools.packages.find]
include = ["arbbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
